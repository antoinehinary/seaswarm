# Project-wide defaults. All values SI. Scenario-specific values live in scenarios/*.yaml.

sim:
  dt_s: 1.0                       # simulation time step

# Leeway coefficients per search-object class: speed = slope * |W10| + offset.
# PIW-1 from OpenDrift opendrift/models/OBJECTPROP.DAT (US Coast Guard leeway method,
# Allen and Plourde 1999), converted to SI: slopes from %, offsets and std errors from cm/s.
# Illustrative values from public literature, not validated for operational use.
leeway_objects:
  PIW-1:
    description: "Person-in-water (PIW), unknown state (mean values)"
    downwind_slope: 0.0096        # 0.96 %
    downwind_offset_mps: 0.0
    downwind_sigma_mps: 0.12      # 12 cm/s
    crosswind_slope: 0.0054       # +/- 0.54 %
    crosswind_offset_mps: 0.0
    crosswind_sigma_mps: 0.094    # 9.4 cm/s
    jibe_probability_per_h: 0.04  # OpenDrift default, consistent with Allen (2005)

belief:
  predict_period_s: 60.0          # probability-map predict step
  pod_points_per_r_max: 8         # cell-averaged POD: midpoint-rule spacing = r_max / 8 (<= 1.2 % error)

# Lateral-range detection model: POD(r) = pod_max * exp(-r^2 / (2 sigma_r^2)) for r <= r_max.
# Illustrative values, not validated sweep widths. Drone cameras look down: r_max = h tan(FOV/2)
# and pod_max(h) = pod_max(h_ref) * exp(-(h - h_ref) / altitude_scale_m), clipped to [0, 1].
sensors:
  drone_eo:
    fov_deg: 70.0                 # r_max = 60 m * tan(35 deg) = 42 m at the reference altitude
    altitude_ref_m: 60.0
    altitude_scale_m: 100.0
    sigma_r_m: 25.0
    pod_max_day: 0.6
    pod_max_night: 0.1
    period_s: 2.0
  drone_thermal:
    fov_deg: 50.0                 # r_max = 60 m * tan(25 deg) = 28 m
    altitude_ref_m: 60.0
    altitude_scale_m: 100.0
    sigma_r_m: 18.0
    pod_max_day: 0.7
    pod_max_night: 0.8
    period_s: 2.0
  usv_mast:                       # mast camera plus lookout, 3 m above the sea
    r_max_m: 150.0
    sigma_r_m: 70.0
    pod_max_day: 0.5
    pod_max_night: 0.2
    period_s: 5.0

# Vehicle types. Illustrative values for a small fixed-wing-speed multirotor and a small USV.
vehicles:
  drone:
    cruise_speed_mps: 15.0
    max_speed_mps: 20.0
    max_turn_rate_deg_s: 60.0
    max_accel_mps2: 4.0
    heading_gain_per_s: 2.0       # k_psi: yaw-rate command per rad of heading error
    speed_time_constant_s: 1.0    # tau_v
    waypoint_radius_m: 15.0       # a waypoint counts as reached inside this radius
    endurance_s: 1500.0           # 25 min at cruise
    idle_power_fraction: 0.7      # multirotor: hovering costs 70 % of cruise power
    altitude_layers_m: [60.0, 80.0, 40.0]  # drone i flies at layer i mod 3 (60 m first)
    sensor: drone_eo              # default sensor; drones_thermal in a scenario use drone_thermal
    rtb_margin: 0.2
    rtb_fixed_s: 120.0            # landing, approach
    turnaround_s: 300.0           # battery swap at base
    detection_sigma_m: 10.0       # position error of a detection
  usv:
    cruise_speed_mps: 4.0
    max_speed_mps: 6.0
    max_turn_rate_deg_s: 10.0
    max_accel_mps2: 0.5
    heading_gain_per_s: 0.5
    speed_time_constant_s: 5.0
    waypoint_radius_m: 30.0
    endurance_s: 28800.0          # 8 h
    idle_power_fraction: 0.2
    altitude_layers_m: [0.0]
    sensor: usv_mast
    rtb_margin: 0.2
    rtb_fixed_s: 900.0
    turnaround_s: 1800.0          # refuel
    detection_sigma_m: 20.0
    recovery_radius_m: 25.0       # person recovered when a USV is this close

safety:
  geofence_margin_m: 1000.0       # rectangle around the search area and the base, plus this margin
  separation_drone_m: 30.0        # drones in the same altitude layer
  separation_usv_m: 50.0
  drone_over_usv_min_altitude_m: 20.0
  separation_horizon_s: 30.0      # predictive check of planned paths
  energy_horizon_s: 10.0          # force RTB if the reserve would be broken within this time
  base_zone_radius_m: 100.0       # deck operations: no separation rule near the base

planner:
  tile_size_m: 400.0              # 4 x 4 cells of 100 m
  track_overlap: 0.1              # lawnmower track spacing = sweep width * (1 - overlap)
  replan_period_s: 120.0
  event_replan_cooldown_s: 10.0   # event-triggered replans (idle, refusal...) at most this often
  recovery_update_s: 30.0         # after a detection: re-aim the recovery USV this often
  lawnmower_prior_mass: 0.95      # baseline covers the rectangle holding this much prior mass
  auction_tasks_per_vehicle: 3    # K = 3 x fleet size candidate tiles per auction
  auction_bundle_size: 3          # B: at most 3 tiles planned ahead per vehicle
  reward_time_constant_s: 3600.0  # auction reward of clearing probability p at time t: p exp(-t / tau)
  cbba_comm_range_m: 3000.0       # radio range between vehicles for strategy "cbba"
